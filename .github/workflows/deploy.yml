name: Publicar documentación

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nunca cancelar un despliegue en curso; encolar en su lugar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # --strict convierte los avisos en errores: un enlace interno roto
      # tumba el build en vez de publicar un 404.
      - run: mkdocs build --strict

      # El código operativo va con tests; se ejecutan para que una copia
      # rota no pueda publicarse junto a documentación que afirma que
      # todo pasa.
      - name: Autocomprobaciones
        working-directory: src
        run: |
          python3 metrics_db.py --selftest
          python3 test_docker_monitor.py
          python3 heartbeat.py --selftest

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
