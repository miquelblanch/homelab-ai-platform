name: CI y publicación

# Corre en cada PR (validación, sin publicar) y en cada push a main
# (validación + publicación). Así un PR muestra checks reales en vez de
# ser solo una pausa manual antes de fusionar.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nunca cancelar un despliegue en curso; encolar en su lugar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Misma versión y mismo comando que se corre en local antes de
      # cualquier commit — ver .gitleaks.toml para el porqué del allowlist.
      - name: Instalar gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Escanear secretos
        run: gitleaks detect --no-git --config .gitleaks.toml --redact

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # --strict convierte los avisos en errores: un enlace interno roto
      # tumba el build en vez de publicar un 404.
      - run: mkdocs build --strict

      # El código operativo va con tests; se ejecutan para que una copia
      # rota no pueda publicarse junto a documentación que afirma que
      # todo pasa.
      - name: Autocomprobaciones
        working-directory: src
        run: |
          python3 metrics_db.py --selftest
          python3 test_docker_monitor.py
          python3 heartbeat.py --selftest

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    # Solo publica en push directo a main — nunca desde un PR, aunque
    # venga de una rama local sin fusionar todavía.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
