name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # --strict turns warnings into errors: a broken internal link
      # fails the build instead of shipping a 404.
      - run: mkdocs build --strict

      # The operational code ships with tests; run them so a broken
      # snapshot cannot be published alongside documentation claiming
      # that everything passes.
      - name: Self-tests
        working-directory: src
        run: |
          python3 metrics_db.py --selftest
          python3 test_docker_monitor.py
          python3 heartbeat.py --selftest

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
