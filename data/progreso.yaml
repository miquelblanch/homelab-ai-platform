# Roadmap progress, shown on the "Progreso / Progress" page.
#
# Edit this file at the monthly review: change `nivel` when a level is reached
# and add the evidence that proves it. The build renders it in both languages.
#
# Scale (evidence only):
#   0 no evidence · 1 studied · 2 used in an own project
#   3 in production, maintained and debugged · 4 designed with method,
#   measured and published
#
# Fields per skill
#   id          stable key
#   es / en     name in each language
#   corto       {es, en}: short label for the radar chart (optional)
#   nivel       current level (0-4)
#   objetivo    target level for the end date
#   hitos       planned level by date (YYYY-MM: level), from the roadmap
#   evidencia   list of {es, en, url?}: what backs the current level
#   cuatro      {es, en}: what "level 4" means for this skill

actualizado: 2026-11-21
fin: 2028-03

competencias:
  - id: evals
    es: Evals de RAG y de LLM
    en: RAG and LLM evals
    corto: {es: Evals LLM, en: LLM evals}
    nivel: 1
    objetivo: 4
    hitos: {2027-02: 3, 2027-06: 4}
    evidencia:
      - es: Tests deterministas de las integraciones con LLM, sin evaluación de calidad.
        en: Deterministic tests of the LLM integrations, no quality evaluation.
    cuatro:
      es: Harness propio con golden set, LLM-as-judge calibrado contra etiquetas humanas y evals en CI que bloquean regresiones.
      en: Own harness with a golden set, an LLM-as-judge calibrated against human labels, and CI evals that block regressions.

