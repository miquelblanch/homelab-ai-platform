site_name: Homelab AI Platform
site_description: >-
  Una plataforma de IA autoalojada en un solo Mac Mini: un agente de Telegram
  con enrutado de modelos por coste, un RAG de búsqueda híbrida sobre 1.991
  documentos y 41 contenedores con auto-remediación instrumentada.
site_author: Miquel Blanch

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github

nav:
  - Visión general: index.md
  - Arquitectura: architecture.md
  - Casos de estudio:
      - Fiabilidad: case-studies/reliability.md
      - Auditoría de seguridad: case-studies/security.md
  - Decisiones y errores: decisions.md

# Páginas aún sin escribir: se excluyen del build para que no queden
# accesibles por URL. Quitar de aquí cuando tengan contenido.
exclude_docs: |
  case-studies/agent.md
  case-studies/rag.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/miquelblanch
  generator: false

copyright: >-
  Escrito por Miquel Blanch. Las direcciones de red, dominios y credenciales
  que aparecen en esta documentación son ilustrativos.
