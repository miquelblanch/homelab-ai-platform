site_name: Miquel Blanch · AI Engineering
site_description: >-
  Lo que construyo, mido y aprendo sobre AI Engineering: evals, RAG, agentes,
  MCP y modelos locales, sobre un homelab real en un Mac Mini.
site_author: Miquel Blanch
site_url: https://miquel.cleverhans.es/

theme:
  name: material
  # Template overrides (language flags). HTML/Jinja only, no JS.
  custom_dir: overrides
  language: es
  font:
    text: Inter
    code: JetBrains Mono
  # Colours are "custom" so docs/stylesheets/extra.css defines them.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github

# Build-time Python hooks (built into MkDocs, no extra dependency).
hooks:
  - hooks/cursos.py
  - hooks/progreso.py
  - hooks/proyectos.py

plugins:
  # Declaring plugins replaces MkDocs' implicit default, so search must be
  # listed explicitly or it disappears.
  - search
  # Bilingual site: Spanish is the default (served at /), English at /en/.
  # "suffix" structure: page.md is Spanish, page.en.md is its English
  # translation. A page without .en.md falls back to the Spanish version,
  # so translations can land page by page without breaking the build.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: es
          default: true
          name: Español
          build: true
        - locale: en
          name: English
          build: true
          site_description: >-
            What I build, measure and learn about AI Engineering: evals, RAG,
            agents, MCP and local models, on a real homelab on a Mac Mini.
          copyright: >-
            Written by Miquel Blanch. Network addresses, domains and
            credentials in this documentation are illustrative.
          nav_translations:
            Inicio: Home
            Cursos: Courses
            Progreso: Progress
            Un sitio bilingüe con dominio propio: A bilingual site on its own domain
            Un re-ranker con LLM: An LLM reranker
            Visión general: Overview
            Arquitectura: Architecture
            El agente: The agent
            El RAG: The RAG
            Fiabilidad: Reliability
            Auditoría de seguridad: Security audit
            Decisiones y errores: Decisions and mistakes

nav:
  - Inicio: index.md
  - CV: cv.md
  - Cursos: cursos.md
  - Progreso: progreso.md
  - Learning log:
      - learning-log/index.md
      - Un sitio bilingüe con dominio propio: learning-log/2026-11-21-sitio-publico.md
      - Un re-ranker con LLM: learning-log/2026-11-27-reranker-llm.md
  - Homelab:
      - Visión general: homelab.md
      - Arquitectura: architecture.md
      - El agente: case-studies/agent.md
      - El RAG: case-studies/rag.md
      - Fiabilidad: case-studies/reliability.md
      - Auditoría de seguridad: case-studies/security.md
      - Decisiones y errores: decisions.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # Material's bundled icons (:material-...:, :fontawesome-...:) rendered as
  # inline SVG at build time: no JS involved.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/miquelblanch
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/miquelblanch
  generator: false

copyright: >-
  Escrito por Miquel Blanch. Las direcciones de red, dominios y credenciales
  que aparecen en esta documentación son ilustrativos.
